<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Hry">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Hokejový trénink</title>
<meta name="hra:predmet" content="Trénink hlavy">
<meta name="hra:popis" content="Reakce, sebeovládání a paměť – 3 krátká kola">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Hokejový trénink hlavy: 3 kola (reakce, go/no-go, pracovní paměť) + pohybové pauzy.
   Jeden úkol na obrazovce, velké dotykové plochy, klidná zpětná vazba, body a odznaky. */
:root{
  --paper:#F6F9FC; --grid:#DCE7F2; --ink:#1C2A3A; --muted:#5B6E82; --card:#FFFFFF; --line:#C9D7E6;
  --ice:#EEF6FC; --ice-red:#F3CFCF; --ice-blue:#CFE0F3;
  --blue:#2563B8; --blue-soft:#E3EDFA; --red:#D23C3C; --red-soft:#FBE7E7;
  --ok:#1F8A4C; --ok-soft:#E3F4E8; --warn:#B45309; --star:#F2B21B;
  --puck:#11161C; --puck-ring:#2E3A48; --puck-edge:#FFFFFF; --on-blue:#FFFFFF;
  --f-display:"Fredoka",ui-rounded,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16202B; --grid:#223142; --ink:#EAF1F8; --muted:#9AAEC2; --card:#1C2836; --line:#2E4157;
  --ice:#1A2A3B; --ice-red:#4A2A31; --ice-blue:#25405C;
  --blue:#6EA8FF; --blue-soft:#1D3150; --red:#FF6B6B; --red-soft:#4A2228;
  --ok:#4CD38A; --ok-soft:#173A28; --warn:#FFB454; --star:#FFC34D;
  --puck:#05080B; --puck-ring:#2A3644; --puck-edge:#9AAEC2; --on-blue:#0F1B2B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16202B; --grid:#223142; --ink:#EAF1F8; --muted:#9AAEC2; --card:#1C2836; --line:#2E4157;
  --ice:#1A2A3B; --ice-red:#4A2A31; --ice-blue:#25405C;
  --blue:#6EA8FF; --blue-soft:#1D3150; --red:#FF6B6B; --red-soft:#4A2228;
  --ok:#4CD38A; --ok-soft:#173A28; --warn:#FFB454; --star:#FFC34D;
  --puck:#05080B; --puck-ring:#2A3644; --puck-edge:#9AAEC2; --on-blue:#0F1B2B; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--f-body); font-size:20px;
  overflow:hidden; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.app{
  height:100%; display:flex; flex-direction:column; gap:14px; max-width:1100px; margin:0 auto;
  padding-top:max(14px,env(safe-area-inset-top,0px)); padding-bottom:max(14px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-height:52px}
.back{min-width:52px;height:52px;border-radius:14px;border:2px solid var(--grid);background:var(--card);color:var(--ink);
  font-size:24px;display:flex;align-items:center;justify-content:center;text-decoration:none}
h1{font-family:var(--f-display); font-weight:700; font-size:clamp(24px,3.2vw,34px); margin:0}
.chip{font-family:var(--f-display); font-weight:600; font-size:18px; background:var(--blue-soft); color:var(--blue); padding:6px 14px; border-radius:999px}
.chip:empty{display:none}
.right{margin-left:auto; display:flex; align-items:center; gap:16px}
.dots{display:flex; gap:6px}
.dot{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--muted)}
.dot.done{background:var(--ink);border-color:var(--ink)}
.dot.cur{border-color:var(--ink);border-width:4px}
.score{font-family:var(--f-display); font-weight:700; font-size:26px; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:6px}
.score.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.2)}}

.stage{
  flex:1; min-height:0; position:relative; overflow:hidden;
  background:var(--card); border:3px solid var(--line); border-radius:28px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  padding:24px; text-align:center;
}
.stage.ice{
  background-color:var(--ice);
  background-image:
    linear-gradient(90deg,transparent calc(50% - 4px),var(--ice-red) calc(50% - 4px),var(--ice-red) calc(50% + 4px),transparent calc(50% + 4px)),
    linear-gradient(90deg,transparent calc(30% - 4px),var(--ice-blue) calc(30% - 4px),var(--ice-blue) calc(30% + 4px),transparent calc(30% + 4px)),
    linear-gradient(90deg,transparent calc(70% - 4px),var(--ice-blue) calc(70% - 4px),var(--ice-blue) calc(70% + 4px),transparent calc(70% + 4px));
  cursor:pointer;
}
.big{font-family:var(--f-display); font-weight:700; font-size:clamp(30px,5vw,50px); line-height:1.2; margin:0}
.small{font-size:clamp(20px,2.6vw,26px); color:var(--muted); line-height:1.5; margin:0; max-width:620px}
.btn{
  min-height:76px; min-width:240px; padding:0 36px; border:none; border-radius:22px;
  background:var(--blue); color:var(--on-blue); font-family:var(--f-display); font-weight:700; font-size:30px; cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.18); transition:transform .08s;
}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.45}
.btn.sec{background:var(--card); color:var(--ink); border:3px solid var(--line); box-shadow:none; font-size:22px; min-height:64px; min-width:0; padding:0 22px}
.btn:focus-visible{outline:4px solid var(--ink); outline-offset:3px}
.row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center}

/* Puk a STOP */
.puck{
  border:none; padding:0; border-radius:50%; background:var(--puck);
  box-shadow:inset 0 0 0 12px var(--puck-ring), 0 0 0 4px var(--puck-edge), 0 8px 0 rgba(0,0,0,.2);
}
.puck-t{position:absolute; width:var(--ps); height:var(--ps); cursor:pointer}
.puck-big{width:min(42vmin,220px); height:min(42vmin,220px)}
.puck-mini{width:90px;height:90px;display:inline-block}
.stop{
  width:min(44vmin,230px); aspect-ratio:1; background:var(--red); color:#fff;
  clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--f-display); font-weight:700; font-size:min(11vmin,58px);
}
.stop-mini{width:96px; font-size:26px; display:inline-flex}
.wait,.fix{font-family:var(--f-display); font-weight:600; font-size:clamp(26px,4vw,40px); color:var(--muted)}
.fix{font-size:64px}

/* Zpětná vazba */
.fb-t{font-family:var(--f-display); font-weight:700; font-size:clamp(36px,6vw,58px); margin:0}
.fb-s{font-size:clamp(22px,3vw,30px); color:var(--muted); margin:0}
.fb.ok .fb-t{color:var(--ok)}
.fb.warn .fb-t{color:var(--warn)}

/* Paměť */
.grid3{--cell:min(17vh,24vw,150px); display:grid; grid-template-columns:repeat(3,var(--cell)); gap:clamp(12px,2vh,22px)}
.cell{
  width:var(--cell); height:var(--cell); border-radius:50%; border:4px solid var(--line); background:var(--card);
  font-family:var(--f-display); font-weight:700; font-size:calc(var(--cell)*.32); color:var(--muted); cursor:pointer; padding:0;
  transition:transform .1s, background-color .1s;
}
.cell.lit{background:var(--star); border-color:var(--star); color:#1C2A3A; transform:scale(1.06)}
.cell.tap{background:var(--blue-soft); border-color:var(--blue); color:var(--blue)}
.cell.bad{background:var(--red-soft); border-color:var(--red); color:var(--red)}
.hint{font-family:var(--f-display); font-weight:600; font-size:clamp(26px,4vw,38px); margin:0}
.mini-grid{display:grid; grid-template-columns:repeat(3,34px); gap:8px}
.mini-grid i{width:34px;height:34px;border-radius:50%;border:3px solid var(--line)}
.mini-grid i.lit{background:var(--star);border-color:var(--star)}

/* Start a konec */
.rounds{display:flex; gap:14px; flex-wrap:wrap; justify-content:center}
.rcard{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 18px; min-width:150px;
  border:3px solid var(--line); border-radius:20px; background:var(--card)}
.rcard b{font-family:var(--f-display); font-size:22px}
.rcard span{font-size:17px; color:var(--muted)}
.emoji{font-size:44px; line-height:1}
.move-ico{font-size:96px; line-height:1}
.stats{display:flex; flex-direction:column; gap:6px; font-size:clamp(20px,2.6vw,24px)}
.badges{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
.badge{display:flex; flex-direction:column; align-items:center; gap:4px; width:130px; padding:12px 8px;
  border:3px solid var(--star); border-radius:20px; background:var(--card)}
.badge b{font-family:var(--f-display); font-size:17px; line-height:1.2}
.badge.off{border-color:var(--line); opacity:.45; filter:grayscale(1)}
.record{font-family:var(--f-display); font-weight:600; color:var(--ok); font-size:24px; margin:0}
.scroll{overflow-y:auto; justify-content:flex-start}
.scroll > :first-child{margin-top:auto} .scroll > :last-child{margin-bottom:auto}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="index.html" aria-label="Zpět na hry">‹</a>
    <h1 id="title">Hokejový trénink</h1>
    <span class="chip" id="chip"></span>
    <div class="right">
      <div class="dots" id="dots"></div>
      <div class="score" id="score" aria-label="Body">⭐ <span id="pts">0</span></div>
    </div>
  </header>
  <main class="stage" id="stage"></main>
</div>
<script src="stats.js"></script>
<script>
/* Záznam výsledků pro rodiče (stats.js). Chyba záznamu nikdy nezastaví hru. */
const hs=(f,...a)=>{try{if(window.HS)window.HS[f](...a)}catch(e){}};
(()=>{
const $=s=>document.querySelector(s);
const stage=$('#stage');
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];

let timers=[];
const T=(f,ms)=>{const id=setTimeout(f,ms);timers.push(id);return id};
const clearT=()=>{timers.forEach(clearTimeout);timers=[]};

const S={score:0,mode:'full',rt:[],miss1:0,go:0,goHit:0,stop:0,stopOk:0,memMax:0,memOk:0};
let resume=null, paused=false;

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

function header(chip,total=0,cur=0){
  $('#chip').textContent=chip||'';
  $('#dots').innerHTML=Array.from({length:total},(_,i)=>`<i class="dot ${i<cur?'done':i===cur?'cur':''}"></i>`).join('');
}
function addScore(n){
  S.score+=n; $('#pts').textContent=S.score;
  const el=$('#score'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}
function plain(){stage.className='stage'; stage.onpointerdown=null; resume=null; clearT()}
function feedback(t,s,type){
  stage.innerHTML=`<div class="fb ${type}"><p class="fb-t">${t}</p><p class="fb-s">${s}</p></div>`;
}

// Pauza při přepnutí aplikace: kolo se po návratu zopakuje od aktuální úlohy
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(resume){clearT(); stage.onpointerdown=null; paused=true} }
  else if(paused){
    paused=false; const r=resume; stage.className='stage'; stage.onpointerdown=null;
    stage.innerHTML=`<p class="big">Pauza ⏸</p><button class="btn" id="go">Pokračovat</button>`;
    $('#go').onclick=()=>r();
  }
});

/* ---------- Úvod ke kolům ---------- */
const ROUNDS=[
  {name:'Brankář', emoji:'🧤', what:'Rychlost',
   vis:'<span class="puck puck-mini"></span>',
   big:'Ťukni na puk!', small:'Co nejrychleji. Ale počkej, až se objeví.'},
  {name:'Stop, nebo střel', emoji:'✋', what:'Sebeovládání',
   vis:'<div class="row" style="align-items:center"><span class="puck puck-mini"></span><span class="stop stop-mini">STOP</span></div>',
   big:'Puk = ťukni.<br>STOP = nic!', small:'Když uvidíš STOP, ruce dolů.'},
  {name:'Trenérova sestava', emoji:'🧠', what:'Paměť',
   vis:'<div class="mini-grid"><i></i><i class="lit"></i><i></i><i></i><i></i><i class="lit"></i><i class="lit"></i><i></i><i></i></div>',
   big:'Zapamatuj si pořadí.', small:'Pak ťukej stejně.'}
];
function intro(i,next){
  plain(); const r=ROUNDS[i];
  header(S.mode==='full'?`Kolo ${i+1} z 3`:'Jedno kolo');
  $('#title').textContent=r.name;
  stage.innerHTML=`${r.vis}<p class="big">${r.big}</p><p class="small">${r.small}</p><button class="btn" id="go">Jdu na to!</button>`;
  $('#go').onclick=next;
}

/* ---------- Kolo 1: Brankář (reakční čas) ---------- */
function round1(done){
  const N=8; let i=0;
  next();
  function rate(rt){return rt<350?['Bleskový zákrok! ⚡',30]:rt<500?['Skvělý zákrok!',20]:rt<800?['Chycený! 🧤',10]:['Máš ho!',5]}
  function next(){
    clearT();
    if(i>=N){stage.onpointerdown=null; resume=null; return done()}
    header(`${i} z ${N} hotovo`,N,i);
    stage.className='stage ice';
    stage.innerHTML='<div class="wait">Čekej na puk…</div>';
    resume=next;
    let shown=false;
    stage.onpointerdown=()=>{
      if(shown) return;                     // ťuknutí vedle puku se netrestá
      clearT(); stage.onpointerdown=null;
      feedback('Moc brzo! 🙂','Počkej, až puk uvidíš.','warn');
      T(next,1400);
    };
    T(()=>{
      shown=true;
      const w=stage.clientWidth, h=stage.clientHeight;
      const ps=Math.round(Math.max(110,Math.min(160,Math.min(w,h)*.24)));
      const pad=24;
      const p=document.createElement('button');
      p.className='puck puck-t'; p.setAttribute('aria-label','Puk');
      p.style.setProperty('--ps',ps+'px');
      p.style.left=(pad+Math.random()*Math.max(0,w-ps-2*pad))+'px';
      p.style.top=(pad+Math.random()*Math.max(0,h-ps-2*pad))+'px';
      stage.innerHTML=''; stage.appendChild(p);
      const t0=performance.now();
      p.onpointerdown=e=>{
        e.stopPropagation(); clearT(); stage.onpointerdown=null;
        const rt=Math.round(performance.now()-t0);
        S.rt.push(rt); const [t,pts]=rate(rt); addScore(pts); hs('task','Brankář – rychlost','Chytit puk',2,rt);
        feedback(t,`${rt} ms · +${pts} ⭐`,'ok');
        i++; T(next,1200);
      };
      T(()=>{
        stage.onpointerdown=null; S.miss1++; hs('task','Brankář – rychlost','Chytit puk',0);
        feedback('Puk proletěl','Nevadí, další chytíš!','warn');
        i++; T(next,1300);
      },2500);
    },1000+Math.random()*2200);
  }
}

/* ---------- Kolo 2: Stop, nebo střel (go / no-go) ---------- */
function makeSeq(N,stops){
  // první dvě vždy puk (jistý úspěch), STOP nikdy dvakrát za sebou
  let seq;
  do{
    seq=Array(N).fill(true);
    const idx=[...Array(N-2).keys()].map(x=>x+2).sort(()=>Math.random()-.5).slice(0,stops);
    idx.forEach(x=>seq[x]=false);
  }while(seq.some((v,k)=>!v&&seq[k-1]===false));
  return seq;
}
function round2(done){
  const N=12, seq=makeSeq(N,4); let i=0, D=1300;
  next();
  function next(){
    clearT(); stage.onpointerdown=null;
    if(i>=N){resume=null; return done()}
    header(`${i} z ${N} hotovo`,N,i);
    stage.className='stage ice';
    stage.innerHTML='<div class="fix">+</div>';
    resume=next;
    T(()=>{
      const go=seq[i];
      stage.innerHTML=go?'<div class="puck puck-big"></div>':'<div class="stop">STOP</div>';
      if(go) S.go++; else S.stop++;
      let answered=false;
      stage.onpointerdown=()=>{
        if(answered) return; answered=true; clearT(); stage.onpointerdown=null;
        hs('task','Stop, nebo střel',go?'Puk → ťuknout':'STOP → neťukat',go?2:0);
        if(go){S.goHit++; addScore(15); D=Math.max(750,D-60); feedback('Gól! 🥅','Rychlá střela · +15 ⭐','ok')}
        else feedback('To byla STOPka ✋','Příště ruce dolů. Nevadí!','warn');
        i++; T(next,1100);
      };
      T(()=>{
        answered=true; stage.onpointerdown=null;
        hs('task','Stop, nebo střel',go?'Puk → ťuknout':'STOP → neťukat',go?0:2);
        if(go){D=Math.min(1500,D+120); feedback('Puk ujel','Příště rychleji!','warn')}
        else{S.stopOk++; addScore(20); feedback('Vydržel jsi! 💪','Sebeovládání · +20 ⭐','ok')}
        i++; T(next,1100);
      },D);
    },600+Math.random()*800);
  }
}

/* ---------- Kolo 3: Trenérova sestava (pracovní paměť) ---------- */
function round3(done){
  const N=6; let i=0, len=3, fails=0;
  next();
  function next(){
    clearT();
    if(i>=N){resume=null; return done()}
    header(`${i} z ${N} hotovo`,N,i);
    stage.className='stage'; stage.onpointerdown=null;
    const seq=[]; while(seq.length<len){const c=rnd(9); if(c!==seq[seq.length-1]) seq.push(c)}
    stage.innerHTML=`<p class="hint" id="hint">Dívej se… 👀</p><div class="grid3">${
      Array.from({length:9},(_,k)=>`<button class="cell" disabled>${k+1}</button>`).join('')}</div>`;
    resume=next;
    const cells=[...stage.querySelectorAll('.cell')];
    let k=0;
    T(show,800);
    function show(){
      if(k>=seq.length) return T(input,300);
      const c=cells[seq[k]]; c.classList.add('lit');
      T(()=>{c.classList.remove('lit'); k++; T(show,260)},700);
    }
    function input(){
      $('#hint').textContent=`Teď ty! Ťukni ${len}×`;
      cells.forEach(c=>c.disabled=false);
      let p=0, locked=false;
      cells.forEach((c,idx)=>c.onpointerdown=()=>{
        if(locked) return;
        if(idx===seq[p]){
          c.classList.add('tap'); T(()=>c.classList.remove('tap'),220);
          p++;
          if(p===seq.length){
            locked=true; S.memOk++; S.memMax=Math.max(S.memMax,len); hs('task','Paměť – sestava',`Sestava ${len} hráčů`,2,len);
            const pts=len*10; addScore(pts);
            T(()=>{feedback('Sestava sedí! ✔',`${len} hráčů · +${pts} ⭐`,'ok'); len=Math.min(8,len+1); fails=0; i++; T(next,1300)},350);
          }
        }else{
          locked=true; c.classList.add('bad'); cells[seq[p]].classList.add('lit'); hs('task','Paměť – sestava',`Sestava ${len} hráčů`,0,len);
          T(()=>{
            feedback('Skoro! 🙂','Další sestava bude tvoje.','warn');
            fails++; if(fails>=2&&len>2){len--; fails=0}
            i++; T(next,1500);
          },1000);
        }
      });
    }
  }
}

/* ---------- Pohybová pauza ---------- */
const MOVES=[
  {ico:'🏋️',t:'Udělej 5 dřepů'},
  {ico:'🦘',t:'10× poskoč na místě'},
  {ico:'🥅',t:'Brankářský postoj.<br>Vydrž 5 vteřin!'},
  {ico:'🌀',t:'5× zatoč rukama<br>jako vrtule'},
  {ico:'⛸️',t:'Bruslař: 6× přešlápni<br>ze strany na stranu'}
];
let lastMove=-1;
function moveBreak(next){
  plain(); header('Pauza na pohyb'); $('#title').textContent='Pohyb!';
  let m; do{m=rnd(MOVES.length)}while(m===lastMove); lastMove=m;
  stage.innerHTML=`<div class="move-ico">${MOVES[m].ico}</div><p class="big">${MOVES[m].t}</p><button class="btn" id="go" disabled>Hotovo za 5</button>`;
  const b=$('#go'); let s=5;
  const tick=()=>{s--; if(s>0){b.textContent=`Hotovo za ${s}`; T(tick,1000)} else {b.disabled=false; b.textContent='Hotovo ✔'}};
  T(tick,1000);
  b.onclick=next;
}

/* ---------- Start a konec ---------- */
function reset(mode){
  Object.assign(S,{score:0,mode,rt:[],miss1:0,go:0,goHit:0,stop:0,stopOk:0,memMax:0,memOk:0,played:new Set()});
  $('#pts').textContent='0';
}
const RUN=[round1,round2,round3];
function startFull(){
  reset('full'); hs('start','Celý trénink');
  const step=(i)=>intro(i,()=>{S.played.add(i); RUN[i](()=> i<2 ? moveBreak(()=>step(i+1)) : end())});
  step(0);
}
function startOne(i){
  reset('one'); hs('start','Jen '+ROUNDS[i].name);
  intro(i,()=>{S.played.add(i); RUN[i](end)});
}

function start(){
  plain(); header(''); $('#dots').innerHTML='';
  $('#title').textContent='Hokejový trénink';
  const best=+store('hokej-trenink-rekord')||0;
  stage.classList.add('scroll');
  stage.innerHTML=`
    <p class="big">Trénink hlavy 🏒</p>
    <div class="rounds">${ROUNDS.map((r,i)=>`<div class="rcard"><div class="emoji">${r.emoji}</div><b>${i+1}. ${r.name}</b><span>${r.what}</span></div>`).join('')}</div>
    <p class="small">3 krátká kola, mezi nimi pohyb. Asi 5 minut.${best?`<br>Tvůj rekord: <b>${best} ⭐</b>`:''}</p>
    <button class="btn" id="full">Začít trénink</button>
    <div class="row">${ROUNDS.map((r,i)=>`<button class="btn sec" data-r="${i}">Jen ${r.name}</button>`).join('')}</div>`;
  $('#full').onclick=startFull;
  stage.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>startOne(+b.dataset.r));
}

function end(){
  hs('end',S.score);
  plain(); header('Hotovo!'); $('#dots').innerHTML='';
  $('#title').textContent='Trénink hotový';
  const hits=S.rt.filter(Boolean);
  const bestRt=hits.length?Math.min(...hits):0;
  const avgRt=hits.length?Math.round(hits.reduce((a,b)=>a+b,0)/hits.length):0;
  const stats=[], badges=[];
  if(S.played.has(0)){
    stats.push(hits.length?`🧤 Nejrychlejší zákrok: <b>${bestRt} ms</b>`:'🧤 Brankář: odehráno');
    badges.push({e:'⚡',t:'Bleskový brankář',on:hits.length>=5&&avgRt<550});
  }
  if(S.played.has(1)){
    stats.push(`✋ STOPky ustál: <b>${S.stopOk} z ${S.stop}</b> · góly <b>${S.goHit} z ${S.go}</b>`);
    badges.push({e:'🧊',t:'Ledové nervy',on:S.stop>0&&S.stopOk===S.stop});
  }
  if(S.played.has(2)){
    stats.push(`🧠 Nejdelší sestava: <b>${S.memMax||'–'}</b>`);
    badges.push({e:'📋',t:'Hlava trenéra',on:S.memMax>=5});
  }
  badges.push({e:'🏆',t:S.mode==='full'?'Celý trénink':'Kolo dokončeno',on:true});

  let rec='';
  if(S.mode==='full'){
    const best=+store('hokej-trenink-rekord')||0;
    if(S.score>best){store('hokej-trenink-rekord',String(S.score)); rec=best?'<p class="record">Nový rekord! 🎉</p>':''}
  }
  stage.classList.add('scroll');
  stage.innerHTML=`
    <p class="big">Super, dokončil jsi to! 🏆</p>
    <p class="fb-t" style="color:var(--ink)">⭐ ${S.score}</p>
    ${rec}
    <div class="stats">${stats.map(s=>`<div>${s}</div>`).join('')}</div>
    <div class="badges">${badges.map(b=>`<div class="badge ${b.on?'':'off'}"><div class="emoji">${b.e}</div><b>${b.t}</b></div>`).join('')}</div>
    <div class="row"><button class="btn" id="again">Hrát znovu</button><button class="btn sec" id="menu">Menu</button></div>`;
  const again=S.mode==='full'?startFull:(()=>startOne([...S.played][0]));
  $('#again').onclick=again;
  $('#menu').onclick=start;
}

start();
})();
</script>
</body>
</html>
