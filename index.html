<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hry na učení</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hry">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Rozcestník: čtverečkovaný sešit, velké dlaždice her seskupené podle předmětu.
   Hry se načítají samy: každý .html soubor v repozitáři (kromě index.html) se zobrazí.
   Předmět a popis hra nese ve značkách <meta name="hra:predmet"> a <meta name="hra:popis">. */
:root{
  --paper:#F6F9FC; --grid:#DCE7F2; --ink:#1C2A3A; --muted:#5B6E82; --card:#FFFFFF;
  --c-mat:#2563B8; --c-mat-soft:#E3EDFA; --c-cj:#D23C3C; --c-cj-soft:#FBE7E7;
  --c-prv:#1F8A4C; --c-prv-soft:#E3F4E8; --c-aj:#7A4CC2; --c-aj-soft:#EEE6FA; --c-jine:#5B6E82; --c-jine-soft:#E9EEF4;
  --f-display:"Fredoka",ui-rounded,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#16202B; --grid:#223142; --ink:#EAF1F8; --muted:#9AAEC2; --card:#1C2836;
  --c-mat:#6EA8FF; --c-mat-soft:#1D3150; --c-cj:#FF7A7A; --c-cj-soft:#4A2228;
  --c-prv:#4CD38A; --c-prv-soft:#173A28; --c-aj:#B794FF; --c-aj-soft:#2E2347; --c-jine:#9AAEC2; --c-jine-soft:#26364A; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:var(--f-body); font-size:20px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.wrap{max-width:1000px; margin:0 auto; padding-block:28px 40px;
  padding-left:max(18px,env(safe-area-inset-left,0px)); padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:28px}
h1{font-family:var(--f-display); font-weight:700; font-size:clamp(34px,5vw,52px); margin:0}
.sub{margin:6px 0 0; color:var(--muted); font-size:20px}
section{display:flex; flex-direction:column; gap:14px}
h2{font-family:var(--f-display); font-weight:600; font-size:26px; margin:0; display:flex; align-items:center; gap:10px}
h2 i{width:14px;height:14px;border-radius:4px;display:inline-block;background:var(--c)}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px}
.tile{display:flex; align-items:center; gap:18px; padding:20px; min-height:130px;
  background:var(--card); border:3px solid var(--c); border-radius:24px;
  color:inherit; text-decoration:none; transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile:focus-visible{outline:4px solid var(--ink); outline-offset:3px}
.ico{flex:none; width:84px; height:84px; border-radius:18px; background:var(--cs); color:var(--c);
  display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:44px}
.tile b{display:block; font-family:var(--f-display); font-size:28px; font-weight:700}
.tile span{display:block; color:var(--muted); font-size:18px; margin-top:4px}
.parents{align-self:center; margin-top:8px; color:var(--muted); font-size:16px; text-decoration:none; padding:10px 16px; border-radius:12px}
.parents:active{background:var(--grid)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hry na učení</h1>
    <p class="sub">Vyber hru. Jedna hra = asi 2 minuty.</p>
  </header>
  <div id="list">
    <!-- Záložní seznam pro případ, že automatické načtení selže -->
    <section style="--c:var(--c-mat);--cs:var(--c-mat-soft)">
      <h2><i></i>Matematika</h2>
      <div class="tiles">
        <a class="tile" href="detektiv-car.html"><div class="ico">D</div><div><b>Detektiv čar</b><span>Křivé a lomené čáry, otevřené a uzavřené</span></div></a>
      </div>
    </section>
  </div>
  <a class="parents" href="rodice/">📊 Pro rodiče – výsledky</a>
</div>
<script>
(async()=>{
  const COL={'matematika':'mat','český jazyk':'cj','čeština':'cj','prvouka':'prv','angličtina':'aj'};
  const ORDER=['Matematika','Český jazyk','Prvouka','Angličtina'];
  const m=location.hostname.match(/^([^.]+)\.github\.io$/i);
  if(!m) return;                                   // mimo GitHub Pages zůstane záložní seznam
  const repo=location.pathname.split('/').filter(Boolean)[0];
  const api=repo?`https://api.github.com/repos/${m[1]}/${repo}/contents/`:`https://api.github.com/repos/${m[1]}/${m[1]}.github.io/contents/`;
  try{
    const r=await fetch(api,{cache:'no-store'}); if(!r.ok) return;
    const files=(await r.json()).filter(f=>f.type==='file'&&/\.html$/i.test(f.name)&&f.name.toLowerCase()!=='index.html');
    const games=await Promise.all(files.map(async f=>{
      try{
        const t=await (await fetch(f.name,{cache:'no-store'})).text();
        const d=new DOMParser().parseFromString(t,'text/html');
        const meta=n=>d.querySelector(`meta[name="${n}"]`)?.content?.trim();
        return {file:f.name,title:(d.title||f.name.replace(/\.html$/i,'')).trim(),subj:meta('hra:predmet')||'Ostatní',desc:meta('hra:popis')||''};
      }catch(e){return null}
    }));
    const ok=games.filter(Boolean); if(!ok.length) return;
    const groups={}; ok.forEach(g=>(groups[g.subj]??=[]).push(g));
    const subjects=Object.keys(groups).sort((a,b)=>{const ia=ORDER.indexOf(a),ib=ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b,'cs')});
    const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    document.getElementById('list').innerHTML=subjects.map(s=>{
      const k=COL[s.toLowerCase()]||'jine';
      const tiles=groups[s].sort((a,b)=>a.title.localeCompare(b.title,'cs')).map(g=>
        `<a class="tile" href="${encodeURI(g.file)}"><div class="ico">${esc(g.title[0].toUpperCase())}</div><div><b>${esc(g.title)}</b>${g.desc?`<span>${esc(g.desc)}</span>`:''}</div></a>`).join('');
      return `<section style="--c:var(--c-${k});--cs:var(--c-${k}-soft)"><h2><i></i>${esc(s)}</h2><div class="tiles">${tiles}</div></section>`;
    }).join('');
  }catch(e){}
})();
</script>
</body>
</html>
